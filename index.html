<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161C22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Residência Onco">
<meta name="description" content="Questões de residência multiprofissional em Atenção ao Câncer e Cuidados Paliativos — Biomedicina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-180.png">
<title>Questões de Residência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topo" id="topo">
  <button class="icone-btn oculto" id="btn-voltar" aria-label="Voltar">‹ Voltar</button>
  <h1 id="titulo">Questões de Residência</h1>
  <button class="icone-btn" id="btn-aa" aria-label="Ajustes de leitura">Aa</button>
</header>

<main id="conteudo"><p class="vazio">Carregando questões…</p></main>

<nav class="abas" id="abas" aria-label="Menu principal">
  <button data-rota="cadernos" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9l1.5 1.5L12 8M8 15l1.5 1.5L12 14M14 9.5h3M14 15.5h3"/></svg>
    Cadernos</button>
  <button data-rota="simulado">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2.5M9.5 3h5"/></svg>
    Simulado</button>
  <button data-rota="estatisticas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
    Desempenho</button>
  <button data-rota="ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    Ajustes</button>
</nav>

<div id="painel" class="painel oculto" role="dialog" aria-modal="true"><div class="painel-caixa" id="painel-caixa"></div></div>
<input type="file" id="entrada-backup" accept=".json,application/json" hidden>
<script src="js/app.js"></script>
</body>
</html>
